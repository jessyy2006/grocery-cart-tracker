<!--
  Email OTP template for CartWise.

  This template is what makes the 6-digit code flow work. Supabase's stock
  Magic Link template contains only {{ .ConfirmationURL }} — a link and no code.
  With that default, a user receives an email with nothing to type into the six
  boxes on /onboarding/verify, and in the native shell the link resolves to
  capacitor://localhost and dead-ends. {{ .Token }} is the code itself.

  The app deliberately does not pass emailRedirectTo (see pages/onboarding/
  Signup.tsx), so no confirmation link is minted and the code is the only path.
  That is why this template shows the code and nothing else.

  Available variables: {{ .Token }}, {{ .ConfirmationURL }}, {{ .SiteURL }},
  {{ .Email }}, {{ .TokenHash }}.

  Inline styles only — Gmail and Outlook strip <style> blocks.
-->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#f6f5f2;margin:0;padding:32px 0;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation"
             style="max-width:420px;background:#ffffff;border-radius:16px;padding:40px 32px;
                    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
        <tr>
          <td style="font-size:20px;font-weight:600;color:#1a1a1a;padding-bottom:8px;">
            your cartwise code
          </td>
        </tr>
        <tr>
          <td style="font-size:15px;line-height:22px;color:#5c5c5c;padding-bottom:28px;">
            Enter this code to finish signing in.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <div style="display:inline-block;background:#f6f5f2;border-radius:12px;
                        padding:18px 28px;font-size:32px;font-weight:700;letter-spacing:8px;
                        color:#1a1a1a;font-family:'SF Mono',Menlo,Consolas,monospace;">
              {{ .Token }}
            </div>
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;line-height:20px;color:#8a8a8a;border-top:1px solid #ebe9e4;padding-top:20px;">
            This code expires in 15 minutes and can only be used once.
            If you didn't request it, you can ignore this email — nobody can sign
            in without it.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
