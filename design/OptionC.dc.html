<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500;700&family=Inter+Tight:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: hsl(155 56% 15%); } a:hover { color: hsl(155 40% 28%); }
    .screen, .screen * { box-sizing: border-box; }
    .screen {
      width: 390px; height: 844px;
      background: hsl(43 30% 95%); color: hsl(36 10% 10%);
      font-family: "Inter Tight", system-ui, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .chrome { height: 44px; display: flex; align-items: center; padding: 0 12px; flex: 0 0 auto; }
    .title {
      font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600;
      letter-spacing: -0.02em; text-align: center; margin: 4px 20px 0;
    }
    .stage {
      flex: 1 1 auto; position: relative; overflow: hidden;
      display: flex; align-items: center;
      perspective: 900px; perspective-origin: 26% 50%;
    }
    .rail { display: flex; align-items: center; padding-left: 16px; transform-style: preserve-3d; }
    .caption { font-size: 15px; color: hsl(35 7% 45%); text-align: center; margin: 0 24px; line-height: 1.45; }
    .dots { display: flex; gap: 4px; justify-content: center; margin-top: 20px; }
    .dot { width: 6px; height: 6px; border-radius: 999px; background: hsl(40 26% 86%); }
    .dot.on { width: 20px; background: hsl(155 56% 15%); }
    .cta {
      margin: 18px auto 22px; background: hsl(155 56% 15%); color: hsl(43 30% 95%);
      font-family: "JetBrains Mono", monospace; font-size: 14px;
      padding: 14px 40px; border-radius: 4px; text-align: center;
    }
    .live {
      width: 196px; height: 326px; flex: 0 0 auto; background: hsl(43 35% 97%);
      border: 1px solid hsl(40 26% 86%); border-radius: 6px; padding: 16px;
      box-shadow: 0 1px 0 hsl(36 10% 10% / 0.04), 0 20px 38px -22px hsl(36 10% 10% / 0.5);
      position: relative; z-index: 9;
    }
    .eyebrow {
      font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 500;
      letter-spacing: 0.13em; text-transform: uppercase; color: hsl(35 7% 45%);
    }
    .row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 9px 0; border-bottom: 1px solid hsl(40 26% 86% / 0.7);
    }
    .row span:first-child { font-size: 13px; }
    .row span:last-child {
      font-family: "JetBrains Mono", monospace; font-size: 8px;
      letter-spacing: 0.1em; text-transform: uppercase; color: hsl(35 7% 45%);
    }
    /* POSITIVE rotateY with a left-edge origin swings the far edge AWAY from
       the viewer. Negative values tip it forward and the perspective magnifies
       it — cards flare at you instead of receding, which is the opposite of
       the gallery read. */
    .plate {
      flex: 0 0 auto; background: hsl(43 35% 97%); border: 1px solid hsl(40 26% 86%);
      border-radius: 6px; padding: 12px;
      transform-origin: left center; box-shadow: -9px 0 20px -11px hsl(36 10% 10% / 0.45);
    }
    .cap {
      font-family: "JetBrains Mono", monospace; letter-spacing: 0.12em;
      text-transform: uppercase; color: hsl(35 7% 45%); white-space: nowrap;
    }
    .bar { background: hsl(40 26% 90%); border-radius: 2px; }
  </style>
</helmet>

<div class="screen">
  <div class="chrome">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="hsl(35 7% 45%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </div>

  <div class="title">build the list.</div>

  <div class="stage">
    <div class="rail">
      <div class="live">
        <div class="eyebrow" style="margin-bottom: 12px;">today's list</div>
        <div class="row"><span>bananas</span><span>produce</span></div>
        <div class="row"><span>1% milk</span><span>dairy</span></div>
        <div class="row"><span>sourdough</span><span>bakery</span></div>
        <div class="row"><span>chicken breast</span><span>meat</span></div>
        <div class="row" style="border-bottom: none;"><span>greek yogurt</span><span>dairy</span></div>
      </div>

      <!-- Rotation shrinks a plate's VISUAL width to w x cos(angle), but its
           layout box stays full width — so the negative margins here are set
           against the visual widths (150x cos40 = 115, 145x cos48 = 97,
           140x cos54 = 82, 136x cos58 = 72), not the declared ones. -->
      <div class="plate" style="width: 150px; height: 268px; margin-left: 16px; z-index: 4; transform: rotateY(40deg); opacity: 0.66; filter: blur(0.8px);">
        <div class="cap" style="font-size: 7px;">running total</div>
        <div style="font-family: Fraunces, serif; font-size: 21px; margin-top: 8px;">$24.75</div>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px;">
          <div class="bar" style="height: 8px; width: 84%;"></div>
          <div class="bar" style="height: 8px; width: 68%;"></div>
          <div class="bar" style="height: 8px; width: 90%;"></div>
        </div>
      </div>

      <div class="plate" style="width: 145px; height: 246px; margin-left: -116px; z-index: 3; transform: rotateY(48deg); opacity: 0.44; filter: blur(1.8px);">
        <div class="cap" style="font-size: 6.5px;">scan</div>
      </div>

      <div class="plate" style="width: 140px; height: 226px; margin-left: -116px; z-index: 2; transform: rotateY(54deg); opacity: 0.27; filter: blur(2.8px);">
        <div class="cap" style="font-size: 6px;">trips</div>
      </div>

      <div class="plate" style="width: 136px; height: 208px; margin-left: -118px; z-index: 1; transform: rotateY(58deg); opacity: 0.15; filter: blur(3.8px);">
        <div class="cap" style="font-size: 5.5px;">habits</div>
      </div>
    </div>
  </div>

  <div class="caption">Add items in seconds — we sort them into aisles for you.</div>

  <div class="dots">
    <div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <div class="cta">next</div>
</div>
</x-dc>
</body>
</html>
